[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed bundles from both the site and the simulator can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/paramotor/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
