<!doctype html>
<html lang="sv" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07050d" />
    <meta
      name="description"
      content="Rymdfabriken – haiku från universum, varelser från livet och radioteater från en fabrik någonstans i rymden. Av Fredrik Lie."
    />
    <title>Rymdfabriken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frijole&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark is the default. Only an explicit choice (stored, or ?theme=light) switches to light.
      try {
        const q = new URLSearchParams(location.search).get("theme")
        if (q === "light" || q === "dark") localStorage.setItem("rf-theme", q)
        if (localStorage.getItem("rf-theme") === "light") document.documentElement.classList.remove("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
